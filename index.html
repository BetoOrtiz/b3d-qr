<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>B3D QR</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: min(90vw, 420px);
      background: #f3f3f3;
      border: 1px solid #d9d9d9;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 260px;
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img src="./logo-b3d.png" alt="Logo B3D" class="logo">
  </div>

  <script>
    (function () {
      "use strict";

      const API = "https://script.google.com/macros/s/AKfycbyml-2N2mjWC48uKC-g7JMms1BFjhuWH-SzaiK7NWAbTmZxyERIDdpDHxUM67X0NZKj/exec";

      const params = new URLSearchParams(window.location.search);
      const id = (params.get("id") || params.get("k") || "").trim().toUpperCase();

      if (!/^[A-Z0-9-]{3,40}$/.test(id)) {
        return;
      }

      let finalizado = false;

      window.b3dRecibir = function (respuesta) {
        if (finalizado) return;
        finalizado = true;

        if (!respuesta || !respuesta.ok || typeof respuesta.url !== "string") {
          return;
        }

        let destino;
        try {
          destino = new URL(respuesta.url);
        } catch (_) {
          return;
        }

        const host = destino.hostname.toLowerCase();

        if (
          destino.protocol !== "https:" ||
          !host.includes(".") ||
          host === "localhost" ||
          host.endsWith(".localhost") ||
          destino.username ||
          destino.password
        ) {
          return;
        }

        setTimeout(function () {
          window.location.replace(destino.href);
        }, 3000);
      };

      const etiqueta = document.createElement("script");
      etiqueta.src = API + "?id=" + encodeURIComponent(id) + "&modo=js&t=" + Date.now();
      etiqueta.async = true;
      document.head.appendChild(etiqueta);
    }());
  </script>
</body>
</html>
