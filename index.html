<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>B3D QR</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f1f1f1;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 170px;
      height: 170px;
      object-fit: contain;
      display: block;
      animation: aparecer 0.8s ease-out, flotar 2s ease-in-out infinite;
    }

    @keyframes aparecer {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes flotar {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
      100% {
        transform: translateY(0px);
      }
    }
  </style>
</head>
<body>
  <img src="./logo-b3d.png" alt="Logo B3D" class="logo">

  <script>
    (function () {
      "use strict";

      const API = "https://script.google.com/macros/s/AKfycbyml-2N2mjWC48uKC-g7JMms1BFjhuWH-SzaiK7NWAbTmZxyERIDdpDHxUM67X0NZKj/exec";

      const params = new URLSearchParams(window.location.search);
      const id = (params.get("id") || params.get("k") || "").trim().toUpperCase();

      if (!/^[A-Z0-9-]{3,40}$/.test(id)) {
        return;
      }

      let finalizado = false;

      window.b3dRecibir = function (respuesta) {
        if (finalizado) return;
        finalizado = true;

        if (!respuesta || !respuesta.ok || typeof respuesta.url !== "string") {
          return;
        }

        let destino;
        try {
          destino = new URL(respuesta.url);
        } catch (_) {
          return;
        }

        const host = destino.hostname.toLowerCase();

        if (
          destino.protocol !== "https:" ||
          !host.includes(".") ||
          host === "localhost" ||
          host.endsWith(".localhost") ||
          destino.username ||
          destino.password
        ) {
          return;
        }

        setTimeout(function () {
          window.location.replace(destino.href);
        }, 3000);
      };

      const etiqueta = document.createElement("script");
      etiqueta.src = API + "?id=" + encodeURIComponent(id) + "&modo=js&t=" + Date.now();
      etiqueta.async = true;
      document.head.appendChild(etiqueta);
    }());
  </script>
</body>
</html>
